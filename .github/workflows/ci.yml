name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        id: swift-test
        run: swift test

      - name: Diagnose failed Swift tests serially
        if: failure() && steps.swift-test.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        run: swift test --skip-build --no-parallel

      - name: Upload test crash reports
        if: failure() && steps.swift-test.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dayline-test-crash-reports
          path: |
            ~/Library/Logs/DiagnosticReports/Dayline*.ips
            ~/Library/Logs/DiagnosticReports/Dayline*.crash
            ~/Library/Logs/DiagnosticReports/swiftpm-testing-helper*.ips
            ~/Library/Logs/DiagnosticReports/swiftpm-testing-helper*.crash
            /Library/Logs/DiagnosticReports/Dayline*.ips
            /Library/Logs/DiagnosticReports/Dayline*.crash
            /Library/Logs/DiagnosticReports/swiftpm-testing-helper*.ips
            /Library/Logs/DiagnosticReports/swiftpm-testing-helper*.crash
          if-no-files-found: ignore
          retention-days: 7

      - name: Install DMG packaging tool
        run: |
          create_dmg_bin="$(./script/install_create_dmg.sh "$RUNNER_TEMP/create-dmg")"
          echo "CREATE_DMG_BIN=$create_dmg_bin" >> "$GITHUB_ENV"

      - name: Validate automation
        run: |
          bash -n script/*.sh
          bash script/notarization_release_test.sh
          bash script/app_bundle_contract_test.sh
          ruby -e 'require "yaml"; %w[ci release notarization-continuation].each { |name| YAML.load_file(".github/workflows/#{name}.yml") }'
          git diff --check
          if ./script/tag_release.sh 1.2.3-beta >/dev/null 2>&1; then exit 1; fi
          if MARKETING_VERSION=1.2.3-beta ./script/package_release.sh >/dev/null 2>&1; then exit 1; fi
          if MARKETING_VERSION=1.2.3-beta ./script/publish_github_release.sh >/dev/null 2>&1; then exit 1; fi

  website-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  ui-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable UI automation
        run: |
          sudo DevToolsSecurity -enable
          sudo xcrun automationmodetool enable-automationmode-without-authentication

      - name: Run XCUITests
        run: ./script/ui_test.sh

      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dayline-XCUITest-evidence
          path: dist/ui-test-results/
          if-no-files-found: warn
          retention-days: 7
